[pytest]
# Pytest configuration for RAG system testing

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    critical: Tests críticos para funcionalidad core
    integration: Tests de integración del pipeline
    quality: Tests de calidad de contenido
    slow: Tests que tardan >2 segundos
    unit: Unit tests de componentes

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not slow"

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Timeouts
timeout = 300
timeout_method = thread
