<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de parámetros · Atlantis GOC</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="brand">
    Revisión de parámetros
    <small id="subtitle">Atlantis GOC · celdas en conflicto entre búsquedas</small>
  </div>
  <div class="spacer"></div>
  <input id="reviewer" placeholder="Tu nombre (revisor)" style="width:180px">
  <button id="btn-export">Exportar CSV</button>
  <button id="btn-export-prov" class="ghost"
          title="Todos los parámetros encontrados y validados: una fila por celda, con estado, búsquedas de respaldo, revisor y referencia">Tabla completa</button>
  <button id="btn-theme" class="ghost" title="Cambiar tema">◐</button>
</header>

<main>
  <div id="view"></div>
</main>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
